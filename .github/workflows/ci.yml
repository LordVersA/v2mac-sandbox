name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { path: sandbox }
      - id: app
        run: echo "ref=$(cat sandbox/app.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: LordVersA/v2mac, ref: "${{ steps.app.outputs.ref }}", path: app }
      - run: swift test
        working-directory: sandbox
  agent:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with: { path: sandbox }
      - id: app
        run: echo "ref=$(cat sandbox/app.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: LordVersA/v2mac, ref: "${{ steps.app.outputs.ref }}", path: app }
      - run: sandbox/Scripts/build-agent.sh
