name: SDK bases
on:
  push:
    tags: ["sdk-v*"]
permissions:
  contents: write
  packages: write
jobs:
  bases:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: Scripts/build-images.sh
      - name: Check the base images
        run: |
          docker run --rm --network none v2mac/base-cli sh -ec 'command -v bash; command -v ssh; command -v curl'
          docker run --rm --network none v2mac/base-gui sh -ec 'command -v sway; command -v wayvnc; command -v wtype; command -v wlr-randr; command -v pipewire; test -f /etc/v2mac/sway.conf'
      - name: Publish pinned bases
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ github.ref_name }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 -c 'import json; json.dump({"allowed": []}, open("out/images/bases.json", "w"))'
          for n in base base-cli base-gui; do
            repo=ghcr.io/lordversa/v2mac-$n
            ref=$repo:$SDK_VERSION
            docker tag v2mac/$n "$ref"
            docker push "$ref"
            docker image inspect --format '{{json .RepoDigests}}' "$ref" | python3 -c 'import json,sys; p="out/images/bases.json"; m=json.load(open(p)); m["allowed"].append(next(d for d in json.load(sys.stdin) if d.startswith(sys.argv[1]+"@sha256:"))); json.dump(m,open(p,"w"),indent=2)' "$repo"
          done
          gh release create "$SDK_VERSION" out/images/bases.json --title "Plugin SDK bases $SDK_VERSION" --notes "Debian arm64 base images for plugin API 1. bases.json pins the GHCR manifests. This is an SDK image release; it does not release the V2Mac app or sandbox helper."
