# The app's own loopback sound card (sandbox.sh gui), card 0 in its container: there is no udev there,
# so WirePlumber can't find it; its sides are named here. One fixed format, the same the agent's bridge uses.
# nofail: an app gets only the sides it was granted, so the other node may not exist.
# The microphone ranks above the speakers, or the speakers' monitor becomes the default source.
context.objects = [
  { factory = adapter flags = [ nofail ] args = { factory.name = api.alsa.pcm.sink node.name = v2mac-speakers
      node.description = "Speakers" media.class = Audio/Sink api.alsa.path = "hw:0,0" priority.session = 2000
      audio.format = S16LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ] } }
  { factory = adapter flags = [ nofail ] args = { factory.name = api.alsa.pcm.source node.name = v2mac-microphone
      node.description = "Microphone" media.class = Audio/Source api.alsa.path = "hw:0,0" priority.session = 2100
      audio.format = S16LE audio.rate = 48000 audio.channels = 2 audio.position = [ FL FR ] } }
]
